name: CI
on:
  pull_request:
  push:
    branches: [main]

# The workflow only ever reads the repo. Without this block it inherits the
# repository default, which in many configurations is read-write - and it runs
# npm install (and every transitive postinstall script) on pull-request code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm ci installs exactly what package-lock.json pins, and fails if the
      # lockfile and manifest disagree. npm install silently resolves new
      # versions, so CI could pass against dependencies production never saw.
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Advisories should arrive as a visible check rather than as a finding in
      # the next manual audit. Reported separately from the build so an
      # unrelated new CVE never wedges an urgent merge.
      #
      # But `continue-on-error` on the ONLY step in this job made the job report
      # SUCCESS while a critical Next.js advisory sat unfixed for weeks — the
      # badge was green, so nobody looked, which is the precise outcome the job
      # exists to prevent. Split in two: HIGH stays advisory, CRITICAL fails the
      # job. A critical advisory is worth one person's attention the day it
      # lands, and the build job is untouched either way.
      - name: High-severity advisories (advisory only)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Critical advisories (fails this job)
        run: npm audit --audit-level=critical
